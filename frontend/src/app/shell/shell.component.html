<div class="adminlte-layout">
  <!-- Mobile Backdrop -->
  <div class="sidebar-backdrop" [class.active]="isMobileMenuOpen" (click)="closeMobileMenu()"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar-adminlte" [class.mobile-open]="isMobileMenuOpen">
    <!-- Brand -->
    <div class="sidebar-brand" style="display: flex; align-items: center; gap: 10px;">
      <img src="assets/logo.png" alt="Licorería Roma Logo" style="width: 36px; height: 36px; border-radius: 50%; border: 2px solid #FFF159; object-fit: cover;">
      <h2 style="margin: 0; font-size: 1.1rem;">Licorería Roma</h2>
    </div>

    <!-- User Panel -->
    <div class="user-panel">
      <div class="user-avatar">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
      <div class="user-info">
        <span class="user-name">{{ authService.getUsername() }}</span>
        <span class="user-status"><span class="status-dot"></span> Online</span>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">
      <div *ngFor="let section of navSections" class="nav-section">
        <span class="nav-section-title">{{ section.title }}</span>
        <a *ngFor="let item of section.items" [routerLink]="item.route" routerLinkActive="active" (click)="closeMobileMenu()" class="nav-item">
          <span class="nav-icon">{{ item.icon }}</span>
          <span class="nav-text">{{ item.label }}</span>
          
          <span class="nav-badge" *ngIf="item.label === 'Pedidos & Ventas'" style="background-color: #00a65a;">V</span>
          <span class="nav-badge" *ngIf="item.label === 'Catálogo de Licores'" style="background-color: #0073b7;">C</span>
          <span class="nav-badge" *ngIf="item.label === 'Dashboard'" style="background-color: #f39c12;">ROMA</span>
        </a>
      </div>

      <div class="nav-section" style="margin-top: 15px;">
        <button type="button" (click)="logout($event)" class="nav-item" style="background: none; border: none; width: 100%; text-align: left; cursor: pointer; color: inherit; font: inherit;">
          <span class="nav-icon">🚪</span>
          <span class="nav-text">Cerrar Sesión</span>
        </button>
      </div>
    </nav>
  </aside>

  <!-- MAIN WRAPPER -->
  <div class="main-wrapper">
    <!-- TOP NAVBAR -->
    <header class="top-navbar">
      <div class="navbar-left">
        <button type="button" class="hamburger-btn" (click)="toggleMobileMenu()">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="navbar-right">
        <!-- Campana Notificaciones Admin -->
        <div class="notif-admin-wrapper">
          <button type="button" class="nav-icon-btn" (click)="toggleNotifMenu()" title="Notificaciones Admin">
            <span class="badge bg-orange" *ngIf="notifService.getUnreadCount('ADMIN') > 0">
              {{ notifService.getUnreadCount('ADMIN') }}
            </span>
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
          </button>

          <!-- Dropdown Notificaciones -->
          <div class="notif-admin-dropdown" *ngIf="showNotifMenu" (click)="$event.stopPropagation()">
            <div class="notif-admin-head">
              <strong>🔔 Notificaciones del Sistema</strong>
              <button (click)="notifService.clearNotifications('ADMIN')" class="btn-clear">Limpiar</button>
            </div>
            <div class="notif-admin-body">
              <div class="notif-admin-item clickable" *ngFor="let n of notifService.getNotificationsForRole('ADMIN')" [class.unread]="!n.read" (click)="onSelectNotification(n)">
                <div class="notif-item-top">
                  <strong>{{ n.title }}</strong>
                  <span class="notif-code" *ngIf="n.orderCode">#{{ n.orderCode }}</span>
                </div>
                <p>{{ n.message }}</p>
                <small>{{ n.timestamp | date:'dd/MM HH:mm' }}</small>
              </div>
              <div class="notif-admin-empty" *ngIf="notifService.getNotificationsForRole('ADMIN').length === 0">
                🔕 Sin notificaciones nuevas
              </div>
            </div>
          </div>
        </div>
        
        <div class="company-info hide-mobile" style="display: flex; align-items: center; gap: 8px;">
        </div>
      </div>
    </header>

    <!-- CONTENT -->
    <main class="content-area">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
